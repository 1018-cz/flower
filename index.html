<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4fb320">
  <meta name="robots" content="noindex, nofollow">
  <title>锦上添花 · Flowering</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #4fb320;
      color: #fff;
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .panel {
      width: 100%;
      max-width: 340px;
      padding: 28px 24px 22px;
      border-radius: 28px;
      background: linear-gradient(160deg, #5edbb2, #52d2a8 50%, #48c79e);
      border: 7px solid #2fa088;
      box-shadow: 0 0 0 6px #3c8a1d, 0 12px 24px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .panel.hidden { visibility: hidden; }
    h1 {
      margin: 0;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-shadow: 0 3px 0 #1f7a62, 0 5px 7px rgba(0, 0, 0, 0.2);
    }
    .hint {
      margin: 16px 0 18px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(20, 110, 84, 0.28);
      font-size: 17px;
    }
    .hint::before { content: "✿ "; color: #ffe27a; }
    .hint b { color: #fff3a6; }
    #pw {
      width: 100%;
      padding: 12px 16px;
      border-radius: 999px;
      border: 3px solid #1f7a62;
      background: #f4fffa;
      color: #1f7a62;
      font-size: 18px;
      text-align: center;
      outline: none;
    }
    #pw:focus { border-color: #9a4a00; }
    .remember {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 12px 0 18px;
      font-size: 14px;
      color: #eafff6;
    }
    .btn {
      min-width: 150px;
      padding: 10px 26px;
      border-radius: 999px;
      border: 3px solid #9a4a00;
      background: linear-gradient(#ffd54f, #ff9d1a);
      color: #fff;
      font: 900 21px "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.1em;
      text-shadow: 0 1.5px 0 #b35c00;
      box-shadow: 0 4.5px 0 #a85400, 0 7px 10px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .btn:active { transform: translateY(3.5px); box-shadow: 0 1px 0 #a85400; }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .msg { min-height: 1.5em; margin: 12px 0 0; font-size: 14px; color: #fff3a6; }
    .shake { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
  </style>
</head>
<body>
  <form id="lock" class="panel" autocomplete="off">
    <h1>锦上添花</h1>
    <p class="hint">提示：<b>小猪</b></p>
    <input id="pw" type="password" placeholder="请输入密码" aria-label="密码" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label class="remember"><input id="remember" type="checkbox" checked> 在这台设备上记住我</label>
    <button id="go" class="btn" type="submit">进入</button>
    <p id="msg" class="msg" role="status"></p>
  </form>

    var STORE = 'flowering-lock-' + P.salt.slice(0, 12);

    function $(id) { return document.getElementById(id); }
    var form = $('lock'), pw = $('pw'), btn = $('go'), msg = $('msg'), remember = $('remember');

    function bytes(b64) {
      var s = atob(b64), u = new Uint8Array(s.length);
      for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
      return u;
    }
    function base64(buf) {
      var u = new Uint8Array(buf), s = '';
      for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
      return btoa(s);
    }
    function forget() { try { localStorage.removeItem(STORE); } catch (e) { /* ignore */ } }

    function decrypt(key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.data))
        .then(function (buf) { return new TextDecoder().decode(buf); });
    }
    function deriveKey(password) {
      return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
        .then(function (base) {
          return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256' },
            base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
        });
    }
    // 用解密出来的游戏页面替换当前页面（页面还没加载完时 document.open 不会清空，要等 load 之后）
    function run(html) {
      if (document.readyState !== 'complete') {
        window.addEventListener('load', function () { setTimeout(function () { run(html); }, 0); });
        return;
      }
      document.open();
      document.write(html);
      document.close();
    }

    if (!window.crypto || !crypto.subtle || !window.TextEncoder) {
      msg.textContent = '当前打开方式无法解锁，请用 https 链接或 Chrome / Safari 打开';
      pw.disabled = btn.disabled = true;
      return;
    }

    // 记住过的设备：直接用保存的密钥解锁
    var saved = null;
    try { saved = localStorage.getItem(STORE); } catch (e) { /* 无痕模式等 */ }
    if (saved) {
      form.classList.add('hidden');
      crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt'])
        .then(decrypt)
        .then(run, function () {
          forget();
          form.classList.remove('hidden');
          pw.focus();
        });
    } else {
      pw.focus();
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var password = pw.value.trim();
      if (!password) { pw.focus(); return; }
      btn.disabled = true;
      btn.textContent = '解锁中…';
      msg.textContent = '';

      deriveKey(password)
        .then(function (key) {
          return decrypt(key).then(function (html) {
            if (!remember.checked) { forget(); return html; }
            return crypto.subtle.exportKey('raw', key).then(function (raw) {
              try { localStorage.setItem(STORE, base64(raw)); } catch (e) { /* ignore */ }
              return html;
            });
          });
        })
        .then(run, function () {
          btn.disabled = false;
          btn.textContent = '进入';
          msg.textContent = '密码不对哦，再想想～';
          form.classList.remove('shake');
          void form.offsetWidth;
          form.classList.add('shake');
          pw.select();
        });
    });
  })();
